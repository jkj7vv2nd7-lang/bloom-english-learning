<head>

<title>Bloom English ― 物語と間隔反復で学ぶ英単語</title>

<style>
:root{ --ink:#26332a; --paper:#fbfaf4; --card:#fff; --line:#dce8dc;

*{box-sizing:border-box;}
html{font-size:17px;}
body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.65; padding-bottom:56px;}
header{background:linear-gradient(135deg,#3d9d63,#79b657); color:#fff; padding:18px 14px 14px; text-align:center;}
header h1{margin:0; font-size:1.5rem; letter-spacing:.03em;}
header p{margin:4px 0 0; font-size:.84rem; opacity:.95;}
main{max-width:840px; margin:0 auto; padding:14px;}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.tabs button{flex:1; min-width:100px; border:2px solid var(--line); background:#fff; border-radius:12px;
  padding:11px 6px; font:inherit; font-weight:700; cursor:pointer; font-size:.98rem;}
.tabs button.on{border-color:var(--green); background:#eafaf0; color:var(--green-d);}
.screen{display:none;} .screen.on{display:block;}
.card{background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:16px; margin:0 0 14px;}
h2.sec{font-size:1.12rem; margin:0 0 10px; border-left:6px solid var(--green); padding-left:9px;}
.small{font-size:.83rem; color:#5a6d5e;}
.btn{display:inline-block; border:none; cursor:pointer; font:inherit; font-weight:700;
  background:var(--green); color:#fff; border-radius:11px; padding:12px 20px; font-size:1rem;}
.btn.ghost{background:#fff; color:var(--green-d); border:1.6px solid var(--green);}
.btn.pink{background:var(--pink);} .btn.gold{background:var(--gold); color:#4a3200;}
.btn:disabled{opacity:.45;}
.toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}
select,input[type="text"]{font:inherit; padding:10px; border:1.6px solid var(--line); border-radius:10px; background:#fff; width:100%;}
label.f{display:block; font-size:.86rem; font-weight:700; margin:10px 0 4px;}
.story-text p{margin:0 0 12px; font-size:1.04rem; line-height:1.9;}
.wl{background:#eafaf0; border-bottom:2px solid var(--green); border-radius:4px; padding:0 3px; cursor:pointer; font-weight:600;}
.wl.sel{background:#ffe9a8;}
.wl.unsure{background:#fdeeee; border-bottom-color:var(--bad);}
.wl.learned{background:#eef6ff; border-bottom-color:#5b84c4;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.chip{border:1.7px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; cursor:pointer; font:inherit; font-size:.9rem;}
.chip.on{border-color:var(--green); background:#eafaf0; font-weight:700;}
.flashcard{border:2px solid var(--green); border-radius:16px; padding:26px 18px; text-align:center; background:#fff;}
.flashcard .term{font-size:2rem; font-weight:800; font-family:Georgia,"Times New Roman",serif;}
.flashcard .ipa{color:#678; font-size:1.02rem; margin-top:2px;}
.flashcard .meaning{font-size:1.25rem; font-weight:700; margin-top:12px;}
.flashcard .ex{margin-top:10px; font-size:.98rem;}
.flashcard .exj{color:#678; font-size:.9rem;}
.rate-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px;}
.rate-row button{border:none; border-radius:11px; padding:13px 4px; font:inherit; font-weight:700; cursor:pointer; color:#fff; font-size:.95rem;}
.r-again{background:#d84f4f;} .r-hard{background:#e8a83c; color:#4a3200 !important;} .r-good{background:#3d9d63;} .r-easy{background:#5b84c4;}
.bar-row{display:grid; grid-template-columns:6em 1fr 3.4em; align-items:center; gap:9px; margin:7px 0; font-size:.92rem;}
.bar{height:14px; background:#edf3ec; border-radius:8px; overflow:hidden;}
.bar i{display:block; height:100%; background:var(--green);}
.choices{display:grid; gap:10px; margin-top:12px;}
.choice{border:2px solid var(--line); background:#fff; border-radius:12px; padding:13px 14px; cursor:pointer; font:inherit; text-align:left;}
.choice.right{border-color:var(--green); background:#eafaf0;}
.choice.wrong{border-color:var(--bad); background:#fdeeee;}
.feedback{margin-top:12px; border-radius:12px; padding:12px 14px; display:none;}
.feedback.ok{background:#eafaf0; display:block;} .feedback.ng{background:#fdf1ec; display:block;}
.word-row{display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding:10px 2px; align-items:baseline;}
.word-row .t{font-weight:700; font-family:Georgia,"Times New Roman",serif; font-size:1.05rem;}
.word-row .m{color:#456; font-size:.92rem;}
.st{font-size:.78rem; border-radius:999px; padding:2px 10px; border:1.4px solid var(--line); white-space:nowrap; cursor:pointer; background:#fff; font:inherit;}
.st.learned{background:#eef6ff; border-color:#5b84c4;} .st.unsure{background:#fdeeee; border-color:var(--bad);}
.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;}
.stat-grid .n{font-size:1.5rem; font-weight:800; color:var(--green-d);}
.stat-grid .l{font-size:.78rem; color:#678;}
.sound-row{display:flex; justify-content:flex-end; margin-bottom:8px;}
.sound-row button{border:1.6px solid var(--line); background:#fff; border-radius:999px; padding:6px 14px; font:inherit; font-size:.86rem; cursor:pointer;}
.mark{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%;
  font-weight:800; font-size:1.15rem; margin-right:9px; vertical-align:-9px; animation:pop .35s ease;}
.mark.ok{background:#3d9d63; color:#fff;} .mark.ng{background:#e39a7d; color:#fff;}
@keyframes pop{0%{transform:scale(.3);} 60%{transform:scale(1.25);} 100%{transform:scale(1);}}
.choice.pulse{animation:pulse .4s ease;}
@keyframes pulse{0%{transform:scale(1);} 40%{transform:scale(1.03);} 100%{transform:scale(1);}}
</style>
</head>
<body>
<header>
  <h1>🌸 Bloom English</h1>
  <p>物語・音声・間隔反復で、入試の英単語を「使える英語」へ</p>
</header>
<main>
<div class="sound-row"><button id="soundBtn" type="button">🔔 音：オン</button></div>
<nav class="tabs" id="tabs">
  <button data-tab="story" class="on">📖 ストーリー</button>
  <button data-tab="review">🃏 今日の復習</button>
  <button data-tab="check">🎯 レベル診断</button>
  <button data-tab="book">📚 単語帳</button>
</nav>

<!-- ストーリー -->
<section id="scr-story" class="screen on">
  <div class="card">
    <div style="display:grid; grid-template-columns:1fr 1.6fr; gap:10px">
      <div><label class="f" for="lvSel">レベル</label>
        <select id="lvSel"><option value="中学">中学（高校入試）</option><option value="高校">高校（大学入試）</option></select></div>
      <div><label class="f" for="stSel">ストーリー</label><select id="stSel"></select></div>
    </div>
    <h2 class="sec" id="storyTitle" style="margin-top:14px"></h2>
    <p class="small" id="storyMeta"></p>
    <div class="toolbar" style="margin:6px 0 10px">
      <button class="btn ghost" id="speakStory">🔊 ストーリーを読み上げ</button>
      <button class="btn ghost" id="stopSpeak">⏹ 止める</button>
    </div>
    <div class="story-text" id="storyText"></div>
    <p class="small">色のついた単語をタップすると、下に意味が出ます。</p>
  </div>
  <div class="card" id="wordCard" style="display:none">
    <h2 class="sec">ことばメモ</h2>
    <div id="wordDetail"></div>
  </div>
  <div class="card">
    <h2 class="sec">ミニクイズ（このストーリーの単語から5問）</h2>
    <div id="quizBox"></div>
  </div>
</section>

<!-- 復習 -->
<section id="scr-review" class="screen">
  <div class="card">
    <h2 class="sec">🃏 今日の復習</h2>
    <div class="stat-grid">
      <div><div class="n" id="statToday">0</div><div class="l">今日の学習数</div></div>
      <div><div class="n" id="statStreak">0</div><div class="l">連続日数</div></div>
      <div><div class="n" id="statLearned">0</div><div class="l">覚えた単語</div></div>
    </div>
    <label class="f" for="goalSel">1日の目標（新しい単語の数）</label>
    <select id="goalSel"><option>3</option><option selected>5</option><option>10</option><option>15</option><option>20</option></select>
    <label class="f" for="courseSel">学習コース</label>
    <select id="courseSel"><option value="中学">中学（高校入試）</option><option value="高校">高校（大学入試）</option><option value="両方">両方</option></select>
    <div id="reviewBox" style="margin-top:14px"></div>
  </div>
</section>

<!-- 診断 -->
<section id="scr-check" class="screen">
  <div class="card">
    <h2 class="sec">🎯 レベル診断（10問）</h2>
    <p class="small">単語の意味を4択で答えます。結果から、おすすめの学習コースをお伝えします。</p>
    <div class="chips" id="checkLv">
      <button class="chip on" data-l="中学">中学レベルで診断</button>
      <button class="chip" data-l="高校">高校レベルで診断</button>
    </div>
    <div id="checkBox"></div>
  </div>
</section>

<!-- 単語帳 -->
<section id="scr-book" class="screen">
  <div class="card">
    <h2 class="sec">📚 単語帳</h2>
    <input type="text" id="bookSearch" placeholder="単語や意味で検索（例：environment、環境）">
    <div class="chips" id="bookLv">
      <button class="chip on" data-l="全て">全て</button>
      <button class="chip" data-l="中学">中学</button>
      <button class="chip" data-l="高校">高校</button>
    </div>
    <p class="small" id="bookCount"></p>
    <div id="bookList"></div>
    <div class="toolbar"><button class="btn ghost" id="bookMore">もっと見る</button></div>
  </div>
</section>

<footer class="small" style="text-align:center; margin-top:18px">
  Bloom English（静的版） ― 記録はこの端末の中にだけ保存されます。<br>
  語彙の一部は CEFR-J Wordlist A1/A2 を参考に編集。発音表記は CMUdict 由来の米語IPAです。
</footer>
</main>

    else if(rating === 'easy'){ interval = prev.repetitions === 0 ? 3 : Math.max(4, prev.intervalDays * ease * 1.3); status = 'learned'; }

    if(SQ.submitted) return;
    SQ.submitted = true; SQ.picked = b.dataset.id;
    const ok = SQ.picked === q.id;
    if(ok) SQ.score++;
    SQ.review.push({ v: q, ok });
    box.querySelectorAll('.choice').forEach(x => {
      x.disabled = true;
      if(x.dataset.id === q.id) x.classList.add('right', 'pulse');
      else if(x.dataset.id === SQ.picked) x.classList.add('wrong');
    });
    playResult(ok);
    const fb = document.getElementById('sqFb');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
    fb.innerHTML = '<span class="mark ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '○' : '✕') + '</span><b>' + (ok ? '正解です！' : '正解は「' + q.meaning + '」です。') + '</b><div>' + q.example + '</div><div class="small">' + q.exampleTranslation + '</div>';
    document.getElementById('sqNext').disabled = false;
    markStudied();
  }));
  document.getElementById('sqNext').addEventListener('click', ()=>{ SQ.idx++; SQ.submitted = false; renderSQ(); });
}
/* ============ 今日の復習（カード） ============ */
let RV = null;
function settings(){ return load(LS.set, { goal: 5, course: '中学' }); }
function renderReviewHome(){
  const st = settings();
  document.getElementById('goalSel').value = String(st.goal);
  document.getElementById('courseSel').value = st.course;
  const days = load(LS.days, {});
  document.getElementById('statToday').textContent = days[todayStr()] || 0;
  document.getElementById('statStreak').textContent = streak();
  const prog = getProg();
  document.getElementById('statLearned').textContent = Object.values(prog).filter(p => p.status === 'learned').length;
  const now = Date.now();
  const inCourse = v => st.course === '両方' || v.level === st.course;
  const due = VOCAB.filter(v => inCourse(v) && prog[v.id] && prog[v.id].nextReviewAt && new Date(prog[v.id].nextReviewAt).getTime() <= now);
  const fresh = shuffle(VOCAB.filter(v => inCourse(v) && !prog[v.id])).slice(0, st.goal);
  const box = document.getElementById('reviewBox');
  if(!due.length && !fresh.length){
    box.innerHTML = '<p>今日の分の復習は終わりました。お疲れさまでした。</p>'; return;
  }
  box.innerHTML = '<p style="margin:0">今日の分：期限の来た復習 <b>' + due.length + ' 語</b> ＋ 新しい単語 <b>' + fresh.length + ' 語</b></p>'
    + '<div class="toolbar"><button class="btn" id="rvStart">復習をはじめる</button></div>';
  document.getElementById('rvStart').addEventListener('click', ()=>{
    RV = { list: [...shuffle(due), ...fresh], idx: 0, flipped: false };
    renderCard();
  });
}
function renderCard(){
  const box = document.getElementById('reviewBox');
  if(!RV || RV.idx >= RV.list.length){
    box.innerHTML = '<p style="font-size:1.08rem">今日の復習が終わりました。お疲れさまでした。</p>'
      + '<div class="toolbar"><button class="btn ghost" id="rvAgain">状態を確認する</button></div>';
    document.getElementById('rvAgain').addEventListener('click', renderReviewHome);
    renderStatsOnly(); return;
  }
  const v = RV.list[RV.idx];
  if(!RV.flipped){
    box.innerHTML = '<p class="small">' + (RV.idx + 1) + ' / ' + RV.list.length + ' 語</p>'
      + '<div class="flashcard"><div class="term">' + v.term + '</div><div class="ipa">' + (v.ipa || '') + '</div>'
      + '<div class="toolbar" style="justify-content:center"><button class="btn ghost" id="cdSpeak">🔊 読み上げ</button>'
      + '<button class="btn" id="cdFlip">意味を見る</button></div></div>';
    document.getElementById('cdSpeak').addEventListener('click', ()=> speak(v.term));
    document.getElementById('cdFlip').addEventListener('click', ()=>{ RV.flipped = true; renderCard(); });
    return;
  }
  box.innerHTML = '<p class="small">' + (RV.idx + 1) + ' / ' + RV.list.length + ' 語</p>'
    + '<div class="flashcard"><div class="term" style="font-size:1.4rem">' + v.term + '</div>'
    + '<div class="meaning">' + v.meaning + '</div>'
    + '<div class="ex">' + v.example + '</div><div class="exj">' + v.exampleTranslation + '</div></div>'
    + '<p class="small" style="margin-top:10px">どれくらい覚えていましたか（正直に選ぶと、次に出るタイミングが合ってきます）</p>'
    + '<div class="rate-row">'
    + '<button class="r-again" data-r="again">Again<br><span style="font-weight:400; font-size:.78rem">忘れた</span></button>'
    + '<button class="r-hard" data-r="hard">Hard<br><span style="font-weight:400; font-size:.78rem">あいまい</span></button>'
    + '<button class="r-good" data-r="good">Good<br><span style="font-weight:400; font-size:.78rem">覚えた</span></button>'
    + '<button class="r-easy" data-r="easy">Easy<br><span style="font-weight:400; font-size:.78rem">かんたん</span></button></div>';
  box.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', ()=>{
    const prog = getProg();
    const prev = prog[v.id] || { intervalDays: 0, repetitions: 0, easeFactor: 2.5 };
    prog[v.id] = scheduleNext(b.dataset.r, { intervalDays: prev.intervalDays || 0, repetitions: prev.repetitions || 0, easeFactor: prev.easeFactor || 2.5 });
    save(LS.prog, prog); markStudied();
    RV.idx++; RV.flipped = false; renderCard();
  }));
}
function renderStatsOnly(){
  const days = load(LS.days, {});
  document.getElementById('statToday').textContent = days[todayStr()] || 0;
  document.getElementById('statStreak').textContent = streak();
  const prog = getProg();
  document.getElementById('statLearned').textContent = Object.values(prog).filter(p => p.status === 'learned').length;
}
document.getElementById('goalSel').addEventListener('change', e => { const s = settings(); s.goal = Number(e.target.value); save(LS.set, s); renderReviewHome(); });
document.getElementById('courseSel').addEventListener('change', e => { const s = settings(); s.course = e.target.value; save(LS.set, s); renderReviewHome(); });
/* ============ レベル診断 ============ */
let CK = null, checkLv = '中学';
document.querySelectorAll('#checkLv .chip').forEach(c => c.addEventListener('click', ()=>{
  document.querySelectorAll('#checkLv .chip').forEach(x => x.classList.toggle('on', x === c));
  checkLv = c.dataset.l; startCheck();
}));
function startCheck(){
  const pool = VOCAB.filter(v => v.level === checkLv);
  const qs = shuffle(pool).slice(0, 10);
  CK = { qs, idx: 0, score: 0, submitted: false };
  renderCheck();
}
function renderCheck(){
  const box = document.getElementById('checkBox');
  if(!CK) { box.innerHTML = '<div class="toolbar"><button class="btn" id="ckStart">診断をはじめる</button></div>';
    document.getElementById('ckStart').addEventListener('click', startCheck); return; }
  if(CK.idx >= CK.qs.length){
    const rate = CK.score / CK.qs.length;
    const msg = checkLv === '中学'
      ? (rate >= .8 ? '中学レベルはしっかり身についています。高校（大学入試）コースにも挑戦してみましょう。' : rate >= .5 ? '中学コースで、間違えた単語から復習を始めるのがおすすめです。' : '中学コースのストーリーから、物語で楽しく始めるのがおすすめです。')
      : (rate >= .8 ? '高校レベルも上級です。このまま大学入試コースで仕上げていきましょう。' : rate >= .5 ? '高校コースで頻出語を固めていきましょう。苦手な語は復習カードで繰り返せます。' : 'まずは中学コースで土台を固めてから、高校レベルに進むのがおすすめです。');
    box.innerHTML = '<p style="font-size:1.1rem">結果：<b>' + CK.score + ' / ' + CK.qs.length + ' 問</b> 正解</p><p>' + msg + '</p>'
      + '<div class="toolbar"><button class="btn" id="ckRetry">もう一度診断する</button></div>';
    document.getElementById('ckRetry').addEventListener('click', startCheck);
    return;
  }
  const q = CK.qs[CK.idx];
  const pool = VOCAB.filter(v => v.level === checkLv && v.id !== q.id);
  const opts = shuffle([q, ...shuffle(pool).slice(0, 3)]);
  box.innerHTML = '<p class="small">' + (CK.idx + 1) + ' / ' + CK.qs.length + ' 問</p>'
    + '<p style="font-size:1.15rem"><b style="font-family:Georgia,serif">' + q.term + '</b> の意味は？</p>'
    + '<div class="choices">' + opts.map(o => '<button class="choice" data-id="' + o.id + '">' + o.meaning + '</button>').join('') + '</div>'
    + '<div class="feedback" id="ckFb"></div>'
    + '<div class="toolbar"><button class="btn" id="ckNext" disabled>' + (CK.idx + 1 >= CK.qs.length ? '結果を見る' : '次の問題へ') + '</button></div>';
  box.querySelectorAll('.choice').forEach(b => b.addEventListener('click', ()=>{
    if(CK.submitted) return; CK.submitted = true;
    const ok = b.dataset.id === q.id; if(ok) CK.score++;
    box.querySelectorAll('.choice').forEach(x => { x.disabled = true;
      if(x.dataset.id === q.id) x.classList.add('right', 'pulse'); else if(x === b) x.classList.add('wrong'); });
    playResult(ok);
    const fb = document.getElementById('ckFb');
    fb.className = 'feedback ' + (ok ? 'ok' : 'ng');
    fb.innerHTML = '<span class="mark ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '○' : '✕') + '</span><b>' + (ok ? '正解です！' : '正解は「' + q.meaning + '」です。') + '</b>';
    document.getElementById('ckNext').disabled = false;
  }));
  document.getElementById('ckNext').addEventListener('click', ()=>{ CK.idx++; CK.submitted = false; renderCheck(); });
}
renderCheck();
/* ============ 単語帳 ============ */
let bookLv = '全て', bookShown = 60;
document.querySelectorAll('#bookLv .chip').forEach(c => c.addEventListener('click', ()=>{
  document.querySelectorAll('#bookLv .chip').forEach(x => x.classList.toggle('on', x === c));
  bookLv = c.dataset.l; bookShown = 60; renderBook();
}));
document.getElementById('bookSearch').addEventListener('input', ()=>{ bookShown = 60; renderBook(); });
document.getElementById('bookMore').addEventListener('click', ()=>{ bookShown += 60; renderBook(); });
function renderBook(){
  const q = document.getElementById('bookSearch').value.trim().toLowerCase();
  const prog = getProg();
  const list = VOCAB.filter(v =>
    (bookLv === '全て' || v.level === bookLv) &&
    (!q || v.term.toLowerCase().includes(q) || v.meaning.includes(q) || v.translation.includes(q)));
  document.getElementById('bookCount').textContent = list.length + ' 語が見つかりました（全 ' + VOCAB.length + ' 語）';
  document.getElementById('bookList').innerHTML = list.slice(0, bookShown).map(v => {
    const st = prog[v.id] ? prog[v.id].status : '';
    return '<div class="word-row"><span><span class="t">' + v.term + '</span> <span class="small">' + (v.ipa || '') + '</span><br><span class="m">' + v.meaning + '</span> <span class="small">[' + v.level + ']</span></span>'
      + '<button class="st ' + st + '" data-id="' + v.id + '">' + (st === 'learned' ? '覚えた' : st === 'unsure' ? 'まだ不安' : '未設定') + '</button></div>';
  }).join('') || '<p class="small">見つかりませんでした。</p>';
  document.getElementById('bookMore').style.display = list.length > bookShown ? '' : 'none';
  document.querySelectorAll('#bookList .st').forEach(b => b.addEventListener('click', ()=>{
    const prog2 = getProg(); const cur = prog2[b.dataset.id] ? prog2[b.dataset.id].status : '';
    const next = cur === '' ? 'learned' : cur === 'learned' ? 'unsure' : '';
    if(next) setStatusSilent(b.dataset.id, next); else { delete prog2[b.dataset.id]; save(LS.prog, prog2); }
    renderBook();
  }));
}
function setStatusSilent(id, status){
  const prog = getProg();
  const prev = prog[id] || { intervalDays: 0, repetitions: 0, easeFactor: 2.5 };
  prog[id] = { ...scheduleNext(status === 'learned' ? 'good' : 'again', { intervalDays: prev.intervalDays || 0, repetitions: prev.repetitions || 0, easeFactor: prev.easeFactor || 2.5 }), status };
  save(LS.prog, prog);
}
storyOptions();
renderBook();
</script>
